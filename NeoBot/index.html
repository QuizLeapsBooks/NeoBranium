<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NeoBranium Live AI | Aevorin</title>
  <meta name="description" content="NeoBranium Live AI by Aevorin - Interactive multimodal voice and vision learning assistant powered by Google Gemini Multimodal Live API.">
  <meta name="theme-color" content="#101827">

  <!-- Preconnect and Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/CSS/ai-pages.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="nb-ai-live">
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <a href="../index.html" class="brand-link" title="Return to NeoBranium Home" aria-label="NeoBranium Home">
        <img src="/online-graduation_16847316.png" alt="NeoBranium Logo" class="brand-logo" onerror="this.style.display='none'">
        <div class="brand-text">
          <span class="brand-title">NeoBranium <span class="brand-accent">Live AI</span></span>
          <span class="brand-byline">by Aevorin</span>
        </div>
      </a>

      <div class="header-actions">
        <a href="../index.html" class="header-nav-link" title="NeoBranium Home">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          <span class="nav-text">Home</span>
        </a>

        <button id="settings-btn" class="header-btn" title="Backend Settings" aria-label="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Status Pill -->
    <div class="status-pill-container">
      <div id="status-pill" class="status-pill" data-state="idle">
        <span class="status-dot"></span>
        <span id="status-text">NeoBranium AI Asleep - Tap Run</span>
      </div>
    </div>

    <!-- AI Multimodal Face Stage -->
    <main class="robot-face-stage" role="main" aria-label="Interactive AI Interface">
      <div id="robot-face" class="robot-face" data-state="idle">
        <!-- Expressive Digital Eyes -->
        <div class="eyes-container" aria-hidden="true">
          <div class="eye left-eye"></div>
          <div class="eye right-eye"></div>
        </div>

        <!-- Animated Audio Waveform Mouth -->
        <div class="mouth-waveform" aria-hidden="true">
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
        </div>

        <!-- Camera Thumbnail (for user visual alignment) -->
        <div id="camera-preview" class="camera-preview-container">
          <video id="camera-video" playsinline muted autoplay aria-label="Live camera feed"></video>
          <button id="cam-flip-btn" class="cam-flip-btn" title="Flip Camera" aria-label="Flip Camera">⇄</button>
        </div>
      </div>
    </main>

    <!-- Real-time Speech Subtitle & Live Status -->
    <div id="transcript-container" class="transcript-container" role="region" aria-live="polite">
      <div id="transcript-pill" class="transcript-pill hidden">
        <span id="transcript-speaker" class="transcript-speaker robot-speaker">NeoBranium AI:</span>
        <span id="transcript-text" class="transcript-text"></span>
      </div>
      <div id="voice-indicator" class="voice-indicator hidden">
        <span class="voice-dot"></span>
        <span id="voice-indicator-text">Listening...</span>
      </div>
    </div>

    <!-- Done Speaking Quick Trigger -->
    <div class="action-bar-container">
      <button id="done-speaking-btn" class="done-speaking-btn hidden" aria-label="Tap when done speaking">
        <span class="btn-pulse-dot"></span>
        <span>Tap When Done Speaking ➔</span>
      </button>
    </div>

    <!-- Controls -->
    <footer class="controls-container" role="contentinfo">
      <button id="run-btn" class="control-btn run-btn" aria-label="Start Conversation">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        <span>Run</span>
      </button>

      <button id="stop-btn" class="control-btn stop-btn" disabled aria-label="Stop Conversation">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="6" width="12" height="12" rx="2"></rect>
        </svg>
        <span>Stop</span>
      </button>
    </footer>
  </div>

  <!-- Settings Modal (Backend URL Config) -->
  <div id="settings-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title" class="modal-title">NeoBranium AI Settings</h2>
        <button id="modal-close-btn" class="modal-close-btn" aria-label="Close Settings">&times;</button>
      </div>

      <div class="form-group">
        <label for="backend-url-input" class="form-label">Backend Service URL (Render):</label>
        <input type="url" id="backend-url-input" class="form-input" placeholder="https://neobranium.onrender.com" spellcheck="false">
        <p class="form-hint">Points to the authoritative NeoBranium Express backend on Render.</p>
      </div>

      <div class="modal-actions">
        <button id="test-backend-btn" class="btn-secondary">Test Connection</button>
        <button id="save-settings-btn" class="btn-primary">Save Settings</button>
      </div>
    </div>
  </div>

  <!-- Main JavaScript Controller (ES Module) -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
