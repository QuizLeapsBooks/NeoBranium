<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome | NeoBranium</title>
  <link rel="stylesheet" href="/CSS/sign.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <meta name="description"
    content="Create an account or sign in to NeoBranium E-Learning Platform for Class 9 and 10 educational resources.">
  <link rel="icon" href="/online-graduation_16847316.png" type="image/png">
</head>
<body>
  
  <!-- Global Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Sign Up Form -->
  <div id="signup-page" class="container">
    <div class="logo">
      <img src="/online-graduation_16847316.png" alt="NeoBranium Logo">
      <span>NeoBranium</span>
    </div>
    <h2>Create Your Account</h2>
    
    <button id="googleSignUpBtn" class="google-btn" type="button">
      <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google logo">
      <span>Continue with Google</span>
    </button>

    <button id="guestSignUpBtn" class="google-btn" type="button" style="margin-top: 10px; background-color: #1e293b; color: white; border: 1px solid #475569;">
      <i class="fa-solid fa-user-secret" style="margin-right: 10px; font-size: 1.2rem;"></i>
      <span>Continue as Guest</span>
    </button>

    <div class="divider">
      <span>OR</span>
    </div>

    <form id="signup-form">
      <div class="input-group">
        <div class="input-box">
          <i class="fa-regular fa-user input-icon"></i>
          <input type="text" id="signup-fname" required aria-label="First Name" placeholder=" " maxlength="50" pattern="[A-Za-z\s]+" title="Only letters and spaces allowed">
          <label>First Name</label>
        </div>
        <div class="input-box">
          <i class="fa-regular fa-user input-icon"></i>
          <input type="text" id="signup-lname" required aria-label="Last Name" placeholder=" " maxlength="50" pattern="[A-Za-z\s]+" title="Only letters and spaces allowed">
          <label>Last Name</label>
        </div>
      </div>
      
      <div class="input-box">
        <i class="fa-regular fa-envelope input-icon"></i>
        <input type="email" id="signup-email" required aria-label="Email" placeholder=" " maxlength="100">
        <label>Email Address</label>
      </div>

      <div class="input-box">
        <i class="fa-solid fa-lock input-icon"></i>
        <input type="password" id="signup-password" required aria-label="Password" placeholder=" " minlength="8" maxlength="128">
        <label>Password</label>
        <span class="eye toggle-password" data-target="signup-password">
          <i class="fa-regular fa-eye"></i>
        </span>
      </div>

      <div class="input-box">
        <i class="fa-solid fa-lock input-icon"></i>
        <input type="password" id="signup-confirm-password" required aria-label="Confirm Password" placeholder=" " minlength="8" maxlength="128">
        <label>Confirm Password</label>
        <span class="eye toggle-password" data-target="signup-confirm-password">
          <i class="fa-regular fa-eye"></i>
        </span>
      </div>

      <div class="terms-checkbox">
        <input type="checkbox" id="terms-checkbox" required>
        <label for="terms-checkbox">I agree to the <a href="/htmls/terms_conditions.html">Terms & Conditions</a> and <a href="/htmls/privacy.html">Privacy Policy</a></label>
      </div>

      <button type="submit" id="submitSignUp" class="submit-btn">
        <span class="btn-text">Sign Up</span>
        <div class="spinner hidden"></div>
      </button>

      <p class="switch-form-text">Already have an account? <a href="#" id="showLoginLink">Sign In</a></p>
    </form>
  </div>

  <!-- Login Form -->
  <div id="login-page" class="container hidden">
    <div class="logo">
      <img src="/online-graduation_16847316.png" alt="NeoBranium Logo">
      <span>NeoBranium</span>
    </div>
    <h2>Welcome Back</h2>
    
    <button id="googleSignInBtn" class="google-btn" type="button">
      <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google logo">
      <span>Continue with Google</span>
    </button>

    <button id="guestSignInBtn" class="google-btn" type="button" style="margin-top: 10px; background-color: #1e293b; color: white; border: 1px solid #475569;">
      <i class="fa-solid fa-user-secret" style="margin-right: 10px; font-size: 1.2rem;"></i>
      <span>Continue as Guest</span>
    </button>

    <div class="divider">
      <span>OR</span>
    </div>

    <form id="login-form">
      <div class="input-box">
        <i class="fa-regular fa-envelope input-icon"></i>
        <input type="email" id="signIn-email" required aria-label="Email" placeholder=" ">
        <label>Email Address</label>
      </div>

      <div class="input-box">
        <i class="fa-solid fa-lock input-icon"></i>
        <input type="password" id="signIn-password" required aria-label="Password" placeholder=" ">
        <label>Password</label>
        <span class="eye toggle-password" data-target="signIn-password">
          <i class="fa-regular fa-eye"></i>
        </span>
      </div>

      <button type="submit" id="submitSignIn" class="submit-btn">
        <span class="btn-text">Sign In</span>
        <div class="spinner hidden"></div>
      </button>

      <p class="switch-form-text">Don't have an account? <a href="#" id="showSignUpLink">Sign Up</a></p>
    </form>
  </div>

  <!-- Firebase Auth Logic -->
  <script type="module" src="/js/firebase-auth.js"></script>
</body>
</html>
