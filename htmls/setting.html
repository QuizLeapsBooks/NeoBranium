<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings | NeoBranium</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/CSS/account-pages.css" />
  <script src="/js/shortcuts.js"></script>
</head>
<body class="nb-account-page">
  <header class="account-header">
    <a href="/index.html" class="account-brand"><img src="/online-graduation_16847316.png" alt="" />NeoBranium</a>
    <div class="account-header-actions">
      <a class="account-header-link" href="/htmls/profile.html"><i class="bi bi-person me-1"></i>Profile</a>
      <a class="account-header-link" href="/htmls/setting.html" aria-current="page"><i class="bi bi-gear me-1"></i>Settings</a>
      <label class="account-header-theme" for="themeSwitch"><i class="bi bi-moon-stars" aria-hidden="true"></i><span>Dark theme</span>
        <input type="checkbox" id="themeSwitch" aria-label="Dark theme" />
      </label>
    </div>
  </header>
  <aside class="account-sidebar" aria-label="Main navigation">
    <div class="account-sidebar-brand"><img src="/online-graduation_16847316.png" alt="" /><span>NeoBranium</span></div>
    <nav>
      <a href="/htmls/dashboard.html"><i class="bi bi-grid-1x2" aria-hidden="true"></i>Dashboard</a>
      <a href="/htmls/notes.html"><i class="bi bi-journal" aria-hidden="true"></i>Notes</a>
      <a href="/htmls/spotlight.html"><i class="bi bi-star" aria-hidden="true"></i>Spotlight (Monthly)</a>
      <a href="/htmls/bot/bot.html"><i class="bi bi-robot" aria-hidden="true"></i>Bot Helper</a>
      <a href="/htmls/question-paper_generator-ai/ai-generate.html"><i class="bi bi-file-earmark-text" aria-hidden="true"></i>Exam Paper Generator</a>
      <a href="/htmls/chat/chat_app.html"><i class="bi bi-chat-dots" aria-hidden="true"></i>Live Chat</a>
    </nav>
  </aside>
  <main class="account-main">
    <div class="account-content-wrap">
      <header class="account-page-heading"><h1>Settings</h1><p>Manage your profile, preferences, and account access.</p></header>
      <div class="settings-layout">
        <section class="account-card">
          <div class="account-identity">
            <div id="initialAvatar" aria-label="User avatar"></div>
            <div class="account-identity-copy"><h2 id="usernameDisplay">Welcome, User!</h2><span class="account-muted">Account profile</span></div>
          </div>
          <div class="settings-section settings-profile-fields">
            <div class="settings-field">
              <label for="firstName">First Name</label>
              <div class="settings-inline-field"><input type="text" id="firstName" autocomplete="off"><button id="saveFirstNameBtn" class="settings-save" type="button">Save</button></div>
            </div>
            <div class="settings-field">
              <label for="lastName">Last Name</label>
              <div class="settings-inline-field"><input type="text" id="lastName" autocomplete="off"><button id="saveLastNameBtn" class="settings-save" type="button">Save</button></div>
            </div>
            <div class="settings-field">
              <label for="username">Username</label>
              <div class="settings-inline-field"><input type="text" id="username" autocomplete="off"><button id="saveUsernameBtn" class="settings-save" type="button">Save</button></div>
            </div>
            <div class="settings-field settings-field--full">
              <label for="bio">Bio</label><textarea id="bio" rows="3" maxlength="150"></textarea>
              <div class="settings-inline-field"><button id="saveBioBtn" class="settings-save" type="button">Save Bio</button></div>
            </div>
          </div>
        </section>
        <div class="settings-section">
          <section class="account-card">
            <h2>Preferences</h2>
            <div class="settings-field">
              <label for="notificationPref">Notification Preferences</label>
              <select id="notificationPref">
                <option value="all">All Notifications</option>
                <option value="important">Important Only</option>
                <option value="none">No Notifications</option>
              </select>
              <div class="settings-inline-field"><button id="saveNotificationBtn" class="settings-save" type="button">Save</button></div>
            </div>
          </section>
          <section class="account-card">
            <h2>Change password</h2>
            <div class="settings-section">
              <div class="settings-field"><label for="currentPassword">Current Password</label><input type="password" id="currentPassword" autocomplete="current-password"></div>
              <div class="settings-field">
                <label for="newPassword">New Password</label>
                <div class="settings-inline-field"><input type="password" id="newPassword" autocomplete="new-password"><button id="changePasswordBtn" class="settings-save" type="button">Change Password</button></div>
              </div>
            </div>
          </section>
          <section class="account-card">
            <h2>Account access</h2>
            <div class="settings-actions"><button id="logoutBtn" type="button"><i class="bi bi-box-arrow-right me-2" aria-hidden="true"></i>Logout</button><div id="status" class="status" role="status" aria-live="polite"></div></div>
          </section>
        </div>
      </div>
    </div>
  </main>
  <nav class="mobile-account-nav" aria-label="Quick navigation">
    <a href="/htmls/dashboard.html"><i class="bi bi-grid-1x2" aria-hidden="true"></i><span>Dashboard</span></a>
    <a href="/htmls/notes.html"><i class="bi bi-journal" aria-hidden="true"></i><span>Notes</span></a>
    <a href="/htmls/spotlight.html"><i class="bi bi-star" aria-hidden="true"></i><span>Spotlight</span></a>
    <a href="/htmls/setting.html" aria-current="page"><i class="bi bi-gear" aria-hidden="true"></i><span>Settings</span></a>
  </nav>
    <script type="module" src="/js/auth.js"></script>
    <script type="module" src="/js/settings.js"></script>
</body>
</html>
