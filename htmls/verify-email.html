<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Your Email | NeoBranium</title>
  <link rel="stylesheet" href="/CSS/sign.css">
  <meta name="description" content="Verify your email to access NeoBranium E-Learning Platform.">
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="/online-graduation_16847316.png" alt="NeoBranium Logo">
      <span>NeoBranium</span>
    </div>
    <h2>Verify Your Email</h2>
    <p>We sent a verification link to <strong id="verifyEmailAddress">your email address</strong>.</p>
    <p>Check your spam or promotions folder if it is not in your inbox.</p>
    <div class="verify-actions">
      <button id="checkVerificationButton" class="submit-btn" type="button" disabled>I've verified my email</button>
      <button id="resendVerificationButton" class="google-btn" type="button" disabled>Resend verification email</button>
    </div>
    <p id="verifyMessage" class="verify-message" role="status" aria-live="polite"></p>
    <p>Need another account? <a href="/htmls/sign.html">Sign In</a></p>
  </div>
  <script type="module" src="/js/verify-email.js"></script>
</body>
</html>
