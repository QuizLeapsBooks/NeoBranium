<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEOBranium AI - Smart Learning Assistant</title>
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Optimized font loading -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <!-- Main stylesheet -->
    <link rel="stylesheet" href="styles.css" />
    
    <!-- Import map for dependencies -->
    <script type="importmap">
        {
            "imports": {
                "@google/generative-ai": "https://esm.run/@google/generative-ai",
                "marked": "https://esm.run/marked",
                "dompurify": "https://esm.run/dompurify"
            }
        }
    </script>
</head>
<body>
    <!-- Animated background -->
    <div class="bg-animation" aria-hidden="true">
        <div class="gradient-sphere"></div>
        <div class="gradient-sphere-2"></div>
    </div>
    
    <main class="chat-container">
        <header class="chat-header">
            <span class="material-symbols-rounded" aria-hidden="true">psychology</span>
            <h1>NS-x AI Learning Assistant</h1>
            <span class="material-symbols-rounded" aria-hidden="true">bolt</span>
        </header>

        <div id="chat-body" class="chat-body" role="log" aria-live="polite">
            <!-- Welcome message will be inserted by JS -->
        </div>

        <div class="typing-container">
            <div class="typing-textarea">
                <textarea 
                    id="chat-input" 
                    placeholder="Ask about science, math, or coding..." 
                    rows="1"
                    aria-label="Your question"
                    required
                ></textarea>
                <button 
                    id="send-btn" 
                    class="send-btn" 
                    aria-label="Send message"
                    disabled
                >
                    <span class="material-symbols-rounded">send</span>
                </button>
            </div>
        </div>
    </main>

    <footer class="neomind-warning" role="contentinfo">
        <p>⚠️ NeoMind AI can make mistakes. Please verify important information.</p>
    </footer>

    <!-- Main script -->
    <script type="module" src="script.js"></script>
</body>
</html>
