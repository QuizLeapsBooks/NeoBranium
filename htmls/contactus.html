<body class="nb-page-shell nb-page-contact">

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"

      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">

            <ul class="dropdown-menu dropdown-menu-end">

              <li><a class="dropdown-item" href="/htmls/setting.html">Settings</a></li>

  <div class="sidebar" id="contactSidebar" aria-label="Main navigation">
    <ul>
      <li><a href="/htmls/dashboard.html"><i class="bi bi-question-circle"></i> Dashboard</a></li>
      <li><a href="/htmls/notes.html"><i class="bi bi-journal"></i> Notes</a></li>
      <li><a href="/htmls/spotlight.html"><i class="bi bi-star"></i> Spotlight (Monthly)</a></li>
      <li class="active"><a href="/htmls/contactus.html" aria-current="page"><i class="bi bi-envelope"></i> Contact Us</a></li>
      <li><a href="/htmls/feedback.html"><i class="bi bi-chat"></i> Feedback/Complaint</a></li>
       <li><a href="/htmls/chat/chat_app.html"><i class="bi bi-chat"></i> Live Chat</a></li>
    </ul>
    <div class="plus-btn">
      <button class="btn btn-primary rounded-circle"><i class="bi bi-plus"></i></button>
    </div>
  </div>

  <main class="contact-main">
    <div class="contact-heading">
      <div>
        <p class="contact-eyebrow">NEOBRANIUM SUPPORT</p>
        <h1>Contact Us</h1>
        <p class="contact-intro">Send us a message and we’ll get back to you.</p>
      </div>
      <button type="button" class="contact-sidebar-toggle" id="contactSidebarToggle" aria-controls="contactSidebar" aria-expanded="false">
        <i class="bi bi-list" aria-hidden="true"></i><span>Menu</span>
      </button>
    </div>
    <section class="contact-card" aria-labelledby="contactFormTitle">
    <h2 id="contactFormTitle">Send a message</h2>
    <form action="https://formspree.io/f/mvgpgvbg" method="POST">
      <label for="name">Your Name</label>
      <input type="text" id="name" name="name" required />

      <label for="email">Your Email <span style="color:#ffeb3b;" title="We'll never share your email.">ⓘ</span></label>
      <input type="email" id="email" name="_replyto" required />

      <label for="subject">Subject</label>
      <input type="text" id="subject" name="subject" />

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <button type="submit">Send Message</button>
    </form>
    </section>
    <div id="userBioBox" class="user-bio-box">
      <p id="userBioText">--Your Bio--</p>
    </div>
  </main>
  <button type="button" class="contact-sidebar-backdrop" id="contactSidebarBackdrop" aria-label="Close navigation" hidden></button>
   <div class="bottom-nav d-md-none">

    <a href="/htmls/feedback.html" class="nav-icon"><i class="bi bi-chat"></i></a>
    <div class="plus-btn">
      <a href="#">
      <button class="btn btn-primary rounded-circle"><i class="bi bi-plus"></i></button>
      </a>
    </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/auth.js"></script>
  <script src="/js/card_func.js"></script>
  <script>

    // Toggle the existing sidebar on mobile.
    const sidebarToggle = document.getElementById('contactSidebarToggle');
    const sidebar = document.getElementById('contactSidebar');
    const sidebarBackdrop = document.getElementById('contactSidebarBackdrop');
    const closeSidebar = () => {
      sidebar.classList.remove('active');
      sidebarBackdrop.hidden = true;
      sidebarToggle.setAttribute('aria-expanded', 'false');
    };
    sidebarToggle.addEventListener('click', () => {
      const isOpen = sidebar.classList.toggle('active');
      sidebarBackdrop.hidden = !isOpen;
      sidebarToggle.setAttribute('aria-expanded', String(isOpen));
      if (isOpen) sidebar.querySelector('a')?.focus();
    });
    sidebarBackdrop.addEventListener('click', closeSidebar);
    sidebar.querySelectorAll('a').forEach(link => link.addEventListener('click', closeSidebar));
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && sidebar.classList.contains('active')) {
        closeSidebar();
        sidebarToggle.focus();
      }
    });
  </script>
  <script src="/js/dark_mode.js"></script>
</body>

</html>
